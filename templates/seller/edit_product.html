{% extends 'base.html' %}

{% block title %}Edit Product – FOREVERR Seller{% endblock %}

{% block content %}

<div style="max-width:700px; margin:0 auto;">
  <div style="margin-bottom: 24px;">
    <a href="{{ url_for('seller_dashboard') }}" style="color:var(--primary); font-size:0.9rem; font-weight:600;">
      <i class="fa fa-arrow-left"></i> Back to Seller Dashboard
    </a>
    <h1 style="font-size: 2.2rem; margin-top: 8px;">Edit Product</h1>
    <p style="color:var(--text-muted);">Modify listing information for "{{ product.name }}"</p>
  </div>

  <div style="background:white; border:1px solid var(--border-light); border-radius:var(--radius-md); padding:32px; box-shadow:var(--shadow-sm);">
    <form action="{{ url_for('seller_edit_product', product_id=product.id) }}" method="POST">
      <!-- Product Name -->
      <div class="form-group">
        <label class="form-label" for="name">Product Name *</label>
        <input type="text" id="name" name="name" class="form-control" value="{{ product.name }}" required>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label class="form-label" for="category_id">Category</label>
        <select id="category_id" name="category_id" class="form-control">
          <option value="">-- Select Category --</option>
          {% for cat in all_categories %}
            <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label" for="description">Product Description</label>
        <textarea id="description" name="description" rows="4" class="form-control">{{ product.description }}</textarea>
      </div>

      <!-- Pricing & Discount -->
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
        <div class="form-group">
          <label class="form-label" for="price">Selling Price (₹) *</label>
          <input type="number" step="0.01" id="price" name="price" class="form-control" value="{{ product.price }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="original_price">Original MRP (₹)</label>
          <input type="number" step="0.01" id="original_price" name="original_price" class="form-control" value="{{ product.original_price or '' }}">
        </div>

        <div class="form-group">
          <label class="form-label" for="discount">Discount %</label>
          <input type="number" id="discount" name="discount" class="form-control" value="{{ product.discount }}" min="0" max="90">
        </div>
      </div>

      <!-- Stock -->
      <div class="form-group">
        <label class="form-label" for="stock">Available Stock Units</label>
        <input type="number" id="stock" name="stock" class="form-control" value="{{ product.stock }}" min="0" required>
      </div>

      <!-- Image URL & Live Preview -->
      <div class="form-group">
        <label class="form-label" for="productImageUrl">Image URL</label>
        <input type="url" id="productImageUrl" name="image" class="form-control" value="{{ product.image or '' }}">
      </div>

      <div style="margin-bottom:24px;">
        <img id="imagePreviewTarget" src="{{ product.image or '' }}" alt="Preview" style="{% if not product.image %}display:none;{% endif %} max-width:200px; height:200px; object-fit:cover; border-radius:6px; border:1px solid var(--border-light);">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">
        Save & Update Product
      </button>
    </form>
  </div>
</div>

{% endblock %}

{% extends 'base.html' %}

{% block title %}Add Product – FOREVERR Seller{% endblock %}

{% block content %}

<div style="max-width:700px; margin:0 auto;">
  <div style="margin-bottom: 24px;">
    <a href="{{ url_for('seller_dashboard') }}" style="color:var(--primary); font-size:0.9rem; font-weight:600;">
      <i class="fa fa-arrow-left"></i> Back to Seller Dashboard
    </a>
    <h1 style="font-size: 2.2rem; margin-top: 8px;">Add New Product</h1>
    <p style="color:var(--text-muted);">List a new handcrafted piece in the Foreverr marketplace</p>
  </div>

  <div style="background:white; border:1px solid var(--border-light); border-radius:var(--radius-md); padding:32px; box-shadow:var(--shadow-sm);">
    <form action="{{ url_for('seller_add_product') }}" method="POST">
      <!-- Product Name -->
      <div class="form-group">
        <label class="form-label" for="name">Product Name *</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. 18K Gold Starburst Necklace" required>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label class="form-label" for="category_id">Category</label>
        <select id="category_id" name="category_id" class="form-control">
          <option value="">-- Select Category --</option>
          {% for cat in all_categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label" for="description">Product Description</label>
        <textarea id="description" name="description" rows="4" class="form-control" placeholder="Describe the materials, dimensions, craftsmanship, and styling recommendations..."></textarea>
      </div>

      <!-- Pricing & Discount -->
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
        <div class="form-group">
          <label class="form-label" for="price">Selling Price (₹) *</label>
          <input type="number" step="0.01" id="price" name="price" class="form-control" placeholder="e.g. 1299.00" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="original_price">Original MRP (₹)</label>
          <input type="number" step="0.01" id="original_price" name="original_price" class="form-control" placeholder="e.g. 1699.00">
        </div>

        <div class="form-group">
          <label class="form-label" for="discount">Discount %</label>
          <input type="number" id="discount" name="discount" class="form-control" placeholder="e.g. 25" min="0" max="90">
        </div>
      </div>

      <!-- Stock -->
      <div class="form-group">
        <label class="form-label" for="stock">Available Stock Units</label>
        <input type="number" id="stock" name="stock" class="form-control" value="15" min="0" required>
      </div>

      <!-- Image URL & Live Preview -->
      <div class="form-group">
        <label class="form-label" for="productImageUrl">Image URL</label>
        <input type="url" id="productImageUrl" name="image" class="form-control" placeholder="https://images.unsplash.com/...">
        <div class="form-hint">Paste an image link. Live preview will appear below.</div>
      </div>

      <div style="margin-bottom:24px;">
        <img id="imagePreviewTarget" src="" alt="Preview" style="display:none; max-width:200px; height:200px; object-fit:cover; border-radius:6px; border:1px solid var(--border-light);">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">
        <i class="fa fa-check"></i> Publish Product
      </button>
    </form>
  </div>
</div>

{% endblock %}
